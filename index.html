<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Urban Plate</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#222;--mute:#777;--line:#e6e0d8;--accent:#c2410c;--ok:#15803d;--bad:#b91c1c;--warn:#a16207;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1917;--card:#262421;--text:#f1ede8;--mute:#a09a92;--line:#3a3733;--accent:#fb923c;--ok:#4ade80;--bad:#f87171;--warn:#facc15}}
:root[data-theme="dark"]{--bg:#1a1917;--card:#262421;--text:#f1ede8;--mute:#a09a92;--line:#3a3733;--accent:#fb923c;--ok:#4ade80;--bad:#f87171;--warn:#facc15}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0 auto 0 0}
nav button{background:none;border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
h2{font-size:16px;margin:4px 0 12px}
.mute{color:var(--mute);font-size:13px}
button.p{background:var(--accent);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px}
button.g{background:none;border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
button.ok{background:var(--ok);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer}
button.no{background:var(--bad);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:15px;width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.code{font-family:ui-monospace,monospace;font-size:24px;letter-spacing:4px;font-weight:700}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pending{color:var(--warn)}.preparing{color:var(--accent)}.accepted{color:var(--accent)}.ready{color:var(--ok)}.rejected{color:var(--bad)}.served{color:var(--mute)}.open{color:var(--ok)}.closed{color:var(--mute)}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--text);font-size:16px;cursor:pointer}
.stack{display:grid;gap:8px;max-width:320px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sticky{position:sticky;bottom:8px;z-index:5;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.late{border-color:var(--bad)}
@media (pointer:coarse){button.p,button.g,button.ok,button.no,nav button{min-height:44px}.qty button{width:40px;height:40px}}

:root{--r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06)}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.card{border-radius:var(--r);box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.dish:hover{transform:translateY(-2px)}
button{transition:transform .08s,opacity .15s,background .15s}button:active:not(:disabled){transform:scale(.96)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:99px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dtag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);margin:0 4px 2px 0}
.add{width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px;font-size:14px;font-weight:600;cursor:pointer}
.qty.on{justify-content:space-between;background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:10px;padding:3px}
.qty.on button{border:0;background:var(--accent);color:#fff}
.bar{display:flex;align-items:center;gap:12px}
.bar .cnt{background:var(--accent);color:#fff;border-radius:99px;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;z-index:50;box-shadow:var(--sh);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:15px;resize:vertical}
.onote{font-size:13px;color:var(--warn);margin-top:2px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}header h1{font-size:15px}main{padding:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body.cx{--bg:#14110f;--card:rgba(255,255,255,.06);--text:#f5efe9;--mute:#a8a098;--line:rgba(255,255,255,.13);--accent:#f97316;--sh:0 8px 30px rgba(0,0,0,.35);
background:radial-gradient(600px 400px at 85% -5%,rgba(249,115,22,.28),transparent 60%),radial-gradient(500px 400px at -10% 40%,rgba(249,115,22,.12),transparent 60%),#14110f;background-attachment:fixed;color-scheme:dark}
body.cx header{background:transparent;border:0;backdrop-filter:none}
body.cx main{padding-bottom:110px}
body.cx .card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.cx select option{color:#222}
body.cx .sticky{bottom:84px;background:rgba(30,26,23,.88)}
.hi{margin:6px 0 0;font-size:15px;color:var(--mute)}
.hero{font-size:34px;line-height:1.1;font-weight:800;margin:4px 0 16px}.hero b{color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:16px;margin-bottom:14px}
.search input{border:0;background:none;padding:14px 0;outline:0}
.cats{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:68px;padding:10px 0 8px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat span{font-size:26px}.cat.on{background:linear-gradient(160deg,rgba(249,115,22,.45),rgba(249,115,22,.12));border-color:var(--accent)}
.promo{display:flex;justify-content:space-between;align-items:center;padding:18px;border-radius:22px;margin-bottom:16px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(249,115,22,.3),rgba(255,255,255,.04))}
.promo b{font-size:20px;display:block}.promo em{font-style:normal;color:var(--accent)}.promo .big{font-size:56px}
.pill{background:linear-gradient(180deg,#fb923c,#ea580c);color:#fff;border:0;border-radius:99px;padding:10px 18px;font-weight:700;cursor:pointer;margin-top:8px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 2px 14px;scrollbar-width:none;scroll-snap-type:x mandatory}.hs::-webkit-scrollbar{display:none}
.pop{flex:none;width:150px;scroll-snap-align:start;padding:10px;border-radius:20px}
.pop .row{padding:6px 0 0}
.plus{width:34px;height:34px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-size:20px;cursor:pointer;flex:none}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 10px}.sec h2{margin:0;font-size:18px}
.dish{border-radius:20px!important}
.bnav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:space-around;padding:8px;border-radius:24px;background:rgba(32,28,25,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);max-width:600px;margin:0 auto;box-shadow:var(--sh)}
.bnav button{background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 10px;border-radius:14px;cursor:pointer}
.bnav button span{font-size:20px}.bnav button.on{color:var(--accent)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:tin .2s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#1d1916;border-radius:28px 28px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.sw i{width:46px;height:26px;border-radius:99px;background:#4b4540;position:relative;transition:.2s}.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{background:var(--accent)}.sw.on i:after{left:23px}
.cta{display:flex;align-items:center;gap:10px;margin-top:12px}.cta .pill{flex:1;margin:0;padding:14px;font-size:16px}

body.mg main{max-width:1280px}
.mshell{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start}
.msb{position:sticky;top:64px;display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:20px;background:rgba(32,28,25,.7);border:1px solid var(--line);backdrop-filter:blur(14px)}
.msb .brand{font-weight:800;font-size:16px;padding:8px 10px 12px}.msb .brand em{font-style:normal;color:var(--accent)}
.msb button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;color:var(--text);padding:11px 12px;border-radius:12px;font-size:14px;cursor:pointer}
.msb button.on{background:linear-gradient(90deg,#fb923c,#ea580c);color:#fff;font-weight:600}
.msb hr{width:100%;margin:8px 0}
.mtop{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mtop h1{margin:0;font-size:26px}.crumb{font-size:13px;color:var(--mute)}.crumb b{color:var(--accent);font-weight:600}
.mcols{display:grid;grid-template-columns:1fr 310px;gap:14px;align-items:start}
.id{display:grid;grid-template-columns:1fr 250px;gap:14px;margin-bottom:14px}
.bal{background:linear-gradient(135deg,rgba(249,115,22,.4),rgba(249,115,22,.08));text-align:center}
.bal small{letter-spacing:1px;font-weight:700}.bal .v{font-size:30px;font-weight:800;color:#fff;margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}.kv small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs2 button{background:none;border:0;color:var(--mute);padding:10px 14px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent}.tabs2 button.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.tw{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);padding:10px 8px;background:rgba(255,255,255,.04)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line)}.tbl .r{text-align:right}
.tot{display:flex;justify-content:space-between;align-items:center;padding-top:12px;font-weight:700}.tot b:last-child{font-size:22px;color:var(--accent)}
.ov2 .row{border-bottom:0;padding:5px 0}.ov2 .hd{background:#ea580c;color:#fff;margin:-14px -14px 10px;padding:11px 14px;border-radius:14px 14px 0 0;font-weight:700;font-size:13px;letter-spacing:.5px}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:12px;cursor:pointer}.act span{font-size:24px}
@media (max-width:900px){.mshell,.mcols,.id{grid-template-columns:1fr}.msb{position:static;flex-direction:row;overflow-x:auto}.msb .brand,.msb hr{display:none}.msb button{white-space:nowrap}}
@media print{header,.msb,.acts,.bnav{display:none!important}body.cx{background:#fff;color:#000}}

.board{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat{padding:14px}.stat small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.stat b{font-size:26px}
@media (max-width:700px){.board{grid-template-columns:1fr}}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bnav button span .ic,.msb button span .ic{width:20px;height:20px}
.cat span .ic{width:28px;height:28px}.act span .ic{width:26px;height:26px}.promo .big .ic{width:56px;height:56px;stroke-width:1.5;color:var(--accent)}

.bh{text-align:center;padding:14px 8px 8px;margin-bottom:6px}
.bh svg{width:min(340px,86%);height:auto;display:block;margin:0 auto}
.bh .wel{font:700 clamp(28px,8vw,40px) Georgia,"Times New Roman",serif;letter-spacing:.32em;margin:6px 0 2px .32em;background:linear-gradient(180deg,#f8e9a1,#c9a227 55%,#8a6a12);-webkit-background-clip:text;background-clip:text;color:transparent}
.bh .bh-tag{font:italic 16px Georgia,serif;color:var(--mute);margin:0 0 12px}
.bh .feat{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bh .feat span{font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid rgba(212,175,55,.45);color:var(--text);background:rgba(212,175,55,.08)}
.ctr{text-align:center;max-width:440px;margin-left:auto;margin-right:auto}.ctr .stack{margin-left:auto;margin-right:auto;max-width:340px;text-align:left}.ctr input,.ctr select{text-align:center}
.bh.sm svg{width:min(240px,70%)}
</style>

var EMO_RE=/[\u{1F300}-\u{1FAFF}]\uFE0F?(?:\u200D[\u{1F300}-\u{1FAFF}]\uFE0F?)*|[\u2B50\u2705\u23F3\u2699\u26A1\u2795\u2796\u274C\u2139]\uFE0F?/gu;
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||ICONS.utensils)+'</svg>'}
function emoName(s){var k=s.replace(/\uFE0F/g,"");return k in EMAP?EMAP[k]:"utensils"}
function iconize(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[],n;
  while(n=w.nextNode()){EMO_RE.lastIndex=0;if(EMO_RE.test(n.nodeValue))L.push(n)}
  L.forEach(function(t){var p=t.parentNode;if(!p)return;var tg=p.tagName;
    if(tg==="OPTION"||tg==="TEXTAREA"||tg==="SCRIPT"||tg==="STYLE"||tg==="TITLE"){t.nodeValue=t.nodeValue.replace(EMO_RE,"").trim();return}
    var s=t.nodeValue,f=document.createDocumentFragment(),last=0,m;EMO_RE.lastIndex=0;
    while(m=EMO_RE.exec(s)){if(m.index>last)f.appendChild(document.createTextNode(s.slice(last,m.index)));var nm=emoName(m[0]);if(nm){var sp=document.createElement("span");sp.innerHTML=ic(nm);f.appendChild(sp.firstChild)}last=m.index+m[0].length}
    if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));
    p.replaceChild(f,t)});
  document.querySelectorAll("[placeholder]").forEach(function(e){e.placeholder=e.placeholder.replace(EMO_RE,"").trim()});
}
function syncMenu(){MENU.length=BASEN;(S.dishes||[]).forEach(function(d){MENU.push(d)})}
function render(){syncMenu();
  var keep={},ae=document.activeElement,aid=ae&&ae.id,as=ae&&ae.selectionStart;
  document.querySelectorAll('#app [id]').forEach(function(e){if(e.value!==undefined&&e.tagName!=='BUTTON')keep[e.id]=e.value});
  var pc=S.reqs.filter(function(r){return r.status==="pending"}).length+S.calls.filter(function(c){return c.status==="open"}).length;
  if(role&&!qrMode&&ACCESS[role].indexOf(view)<0){view=ACCESS[role][ACCESS[role].length-1]==="manager"&&role==="manager"?"manager":ACCESS[role][0];location.hash=view}
  var staffView=view!=="customer";document.body.className=(view==="customer"&&!qrMode)?"cx":(staffView?"cx mg":"");
  document.getElementById("nav").innerHTML=VIEWS.filter(function(v){return role?ACCESS[role].indexOf(v)>-1:v==="customer"}).map(function(v){
    var n=(v==="waiter"&&pc)?" ("+pc+")":"";
    return '<button class="'+(v===view?"on":"")+'" onclick="go(\''+v+'\')">'+LABEL[v]+n+'</button>'}).join(" ")+((role||(view==="customer"&&session.table))?' <button onclick="toggleSnd()" aria-label="Toggle notification sound">Sound: '+(SND?"On":"Off")+'</button>':'')+(role?' <button onclick="lock()">Sign out</button>':(staffView?'':' <button onclick="go(\'waiter\')">Staff</button>'));
  if(qrMode)document.getElementById("nav").innerHTML="";
  document.getElementById("app").innerHTML=(staffView&&!role)?pinV():view==="waiter"?waiterV():view==="kitchen"?kitchenV():view==="manager"?managerV():customerV();
  for(var k in keep){var e=document.getElementById(k);if(e&&e.value!==undefined&&e.value!==keep[k]&&k!=='pin'||(e&&k==='pin'))e.value=keep[k]}
  if(aid){var f=document.getElementById(aid);if(f){f.focus();try{if(as!=null)f.setSelectionRange(as,as)}catch(x){}}}
  iconize(document.body);checkAlerts();
}

/* ---------- Customer ---------- */
function customerV(){
  if(session.user&&!S.users[session.user])session.user=null;
  // auto-join when the waiter accepted my table request
  if(session.reqId){
    var r=S.reqs.filter(function(x){return x.id===session.reqId})[0];
    if(r&&r.status==="accepted"&&S.tables[r.table].code===r.code){session.table={id:r.table,code:r.code};session.reqId=null;session.err=""}
  }
  if(session.table&&S.tables[session.table.id].waiter)session.wname=S.tables[session.table.id].waiter;
  // session ended (paid) -> code changed or cleared
  if(session.table&&S.tables[session.table.id].code!==session.table.code){
    session.rateFor={w:session.wname,code:session.table.code,table:session.table.id};session.table=null;session.cart={};session.err="Payment received – thank you! This table session has ended. Scan the tag to start a new one.";
  }
  if(session.table)return session.tab==="games"?gamesV():session.tab==="pay"?payV():session.tab==="info"?infoV():session.tab==="offers"?offersV():menuV();
  if(session.reqId){
    var q=S.reqs.filter(function(x){return x.id===session.reqId})[0];
    if(q&&q.status==="rejected"){session.reqId=null;session.err="The waiter could not open this table. Please ask the staff."}
    else return '<div class="card"><h2>Table '+q.table+' requested</h2><p>⏳ Waiting for the waiter to confirm you are seated…</p><p class="mute">Once accepted, the table gets a one-time code and your menu opens automatically.</p><button class="g" onclick="cancelReq()">Cancel</button></div>';
  }
  return brandV("guest")+rateAfterV()+resumeV()+accountV()+'<div class="card ctr"><h2>Open your table</h2>'+(session.scan?'<p>📍 You scanned the tag on <b>Table '+session.scan+'</b>. Request to open it below.</p>':'<p class="mute">The QR/NFC tag on the table only holds the table number (no code). Pick your table to simulate scanning it.</p>')+''+
    '<div class="stack"><select id="tb">'+tableOpts()+'</select><button class="p" onclick="requestTable()">Request to open this table</button></div>'+
    '<hr><b>Already seated with friends?</b><p class="mute">Ask them for the table code and join the same bill.</p>'+
    '<div class="stack"><input id="cd" inputmode="numeric" maxlength="4" placeholder="4-digit table code"><button class="g" onclick="joinTable()">Join table</button></div>'+
    (session.err?'<div class="err">'+session.err+'</div>':'')+'</div>';
}

function chg(id,d){session.cart[id]=Math.max(0,(session.cart[id]||0)+d);render()}
function requestTable(){
  S=load();var t=+document.getElementById("tb").value;
  if(S.tables[t].code){session.err="Table "+t+" is already open. Ask the people at your table for their code.";render();return}
  var dup=S.reqs.filter(function(r){return r.table===t&&r.status==="pending"})[0];
  var id=dup?dup.id:S.seq++;
  if(!dup){S.reqs.push({id:id,table:t,status:"pending",time:Date.now(),user:session.user||null});note("🪑 Table "+t+" requested to sit"+(session.user&&S.users[session.user]?" – loyal customer "+S.users[session.user].name:""))}
  save();session.reqId=id;session.err="";render();
}
function cancelReq(){S=load();S.reqs=S.reqs.filter(function(r){return r.id!==session.reqId});save();session.reqId=null;render()}
function joinTable(){
  S=load();var t=+document.getElementById("tb").value,c=document.getElementById("cd").value.trim();
  if(Date.now()<(session.lockUntil||0)){session.err="Too many wrong codes. Wait "+Math.ceil((session.lockUntil-Date.now())/1000)+" seconds and try again.";render();return}
  if(S.tables[t].code&&S.tables[t].code===c){session.table={id:t,code:c};session.err="";session.tries=0;tagUser(t);save()}

  render();
}

/* Memory */
function memStart(){var e=["🍕","🍔","🍟","🌮","🍣","🍰","🍩","🍉"];var c=e.concat(e).map(function(x){return {e:x,k:Math.random()}}).sort(function(a,b){return a.k-b.k});session.mem={cards:c,open:[],done:{},moves:0,lock:false}}
function memV(){
  var m=session.mem,won=Object.keys(m.done).length===16;
  var h='<div class="card"><div class="row"><b>Memory Match</b><span>Moves: '+m.moves+'</span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px">';
  m.cards.forEach(function(c,i){var show=m.done[i]||m.open.indexOf(i)>-1;h+='<button class="g" style="height:64px;font-size:28px" '+(show?'disabled':'')+' onclick="flip('+i+')">'+(show?c.e:"?")+'</button>'});
  h+='</div>';
  if(won)h+='<p><b>🎉 Done in '+m.moves+' moves!</b></p><button class="p" onclick="memStart();render()">Play again</button>';
  return h+'</div>';
}
function flip(i){
  var m=session.mem;if(m.lock||m.open.length>1||m.done[i]||m.open[0]===i)return;
  m.open.push(i);
  if(m.open.length===2){
    m.moves++;var a=m.cards[m.open[0]],b=m.cards[m.open[1]];
    if(a.e===b.e){m.done[m.open[0]]=1;m.done[m.open[1]]=1;m.open=[];if(Object.keys(m.done).length===16)addScore("memory",m.moves)}
    else{m.lock=true;setTimeout(function(){m.open=[];m.lock=false;render()},800)}
  }
  render();
}

/* Tic-Tac-Toe: table or cross-table */
function tttV(){
  var tb=session.table,g=session.gid?S.games.filter(function(x){return x.id===session.gid})[0]:null;
  if(g)return tttGame(g);
  session.gid=null;

  var h='<div class="card"><b>Tic-Tac-Toe</b><p class="mute">Start a game and wait for an opponent, or join one below.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="p" onclick="newG(\'table\')">Play with my table</button><button class="g" onclick="newG(\'all\')">Play with another table</button></div></div>';
  h+='<h2>Open games you can join</h2>';
  h+=open.length?open.map(function(x){return '<div class="card"><div class="row"><span><b>'+esc(x.host)+'</b> · '+(x.scope==="all"?"Table "+x.table+" (open to all tables)":"your table")+'</span><button class="p" onclick="joinG('+x.id+')">Join</button></div></div>'}).join(""):'<p class="mute">No open games right now.</p>';
  return h;
}
function getG(id){return S.games.filter(function(x){return x.id===id})[0]}
function newG(scope){S=load();var tb=session.table,id=S.seq++;S.games.push({id:id,scope:scope,table:tb.id,code:tb.code,host:session.name,hostId:session.pid,guest:null,guestId:null,board:["","","","","","","","",""],turn:"X",winner:null,status:"wait",time:Date.now()});save();session.gid=id;render()}
function joinG(id){S=load();var g=getG(id);if(!g||g.guest)return;g.guest=session.name;g.guestId=session.pid;g.status="play";save();session.gid=id;render()}
function endG(id){S=load();S.games=S.games.filter(function(x){return x.id!==id});save();session.gid=null;render()}
function rematch(id){S=load();var g=getG(id);if(!g)return;g.board=["","","","","","","","",""];g.winner=null;g.turn="X";save();render()}
function mv(id,i){
  S=load();var g=getG(id);if(!g||g.winner||g.board[i])return;
  var me=g.hostId===session.pid?"X":"O";if(g.turn!==me)return;
  g.board[i]=me;
  [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].forEach(function(l){var b=g.board;if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])g.winner=b[l[0]]});
  if(!g.winner&&g.board.every(function(c){return c}))g.winner="draw";
  g.turn=me==="X"?"O":"X";save();render();
}
function tttGame(g){
  var me=g.hostId===session.pid?"X":"O";
  var h='<div class="card"><div class="row"><b>vs '+esc(me==="X"?(g.guest||"…"):g.host)+'</b><span class="mute">You are '+me+'</span></div>';
  if(g.status==="wait")return h+'<p>⏳ Waiting for an opponent to join…</p><button class="g" onclick="endG('+g.id+')">Cancel</button></div>';
  var msg=g.winner?(g.winner==="draw"?"🤝 It’s a draw!":(g.winner===me?"🎉 You won!":"😅 You lost")):(g.turn===me?"Your turn":"Opponent’s turn…");
  h+='<p><b>'+msg+'</b></p><div style="display:grid;grid-template-columns:repeat(3,80px);gap:6px">';
  g.board.forEach(function(c,i){h+='<button class="g" style="height:80px;font-size:34px" '+((c||g.winner||g.turn!==me)?'disabled':'')+' onclick="mv('+g.id+','+i+')">'+c+'</button>'});
  h+='</div><p>';
  if(g.winner)h+='<button class="p" onclick="rematch('+g.id+')">Rematch</button> ';
  return h+'<button class="g" onclick="endG('+g.id+')">Leave game</button></p></div>';
}

function rejectReq(id){S=load();S.reqs.forEach(function(r){if(r.id===id)r.status="rejected"});save();render()}
function setS(id,st){S=load();S.orders.forEach(function(o){if(o.id===id){o.status=st;note(({accepted:"👨‍🍳 Order accepted",preparing:"🔥 Chef is preparing",ready:"🔔 Order ready",served:"🍽️ Order served",rejected:"❌ Order rejected"})[st]+" – Table "+o.table+": "+fmt(o.items))}});save();render()}
function pay(t,method,user,offerId){S=load();var _cc=S.calls.filter(function(c){return c.table==t&&c.type==="cash"})[0];method=method||(_cc?"Cash":"At table");var _b=bill(t,S.tables[t].code);var _uph=user||(_cc&&_cc.user),_oid=offerId||(_cc&&_cc.offer),_off=S.offers.filter(function(o){return o.id===_oid})[0],_u=_uph&&S.users[_uph],_disc=(_u&&_off&&_u.points>=_off.cost)?discountOf(_off,_b.total):0;if(!_disc)_off=null;_b={total:_b.total-_disc};S.payments.unshift({table:t,method:method,amount:_b.total,time:Date.now()});S.payments=S.payments.slice(0,8);var _it={},_n=0;S.orders.forEach(function(o){if(o.table==t&&o.code===S.tables[t].code&&(o.status==="accepted"||o.status==="preparing"||o.status==="ready"||o.status==="served")){_n++;o.items.forEach(function(i){_it[i.name]=(_it[i.name]||0)+i.qty})}});S.paid.push({time:Date.now(),table:t,method:method,amount:_b.total,orders:_n,items:_it});note("💰 Table "+t+" paid "+money(_b.total)+" by "+method);if(_u){var _earn=Math.floor(_b.total/100),_bn=0;if(_off)_u.points-=_off.cost;_u.points+=_earn;_u.visits++;_u.spent+=_b.total;if(_u.visits%5===0){_u.points+=20;_bn=20}note("⭐ "+_u.name+" earned "+_earn+" pts"+(_bn?" (+20 visit bonus)":"")+(_off?" and used “"+_off.title+"”":""));}S.calls=S.calls.filter(function(c){return c.table!=t});var c=S.tables[t].code;S.orders.forEach(function(o){if(o.table==t&&o.code===c&&o.status==="served")o.status="paid"});S.tables[t].code=null;S.tables[t].users=[];S.games=S.games.filter(function(x){return !(x.table==t&&x.scope==="table")});save();render()}
function wipe(){S=fresh();save();session.table=null;session.reqId=null;session.cart={};session.err="";render()}

/* ---------- Kitchen ---------- */
function kitchenBody(){
  var byAge=function(a,b){return a.time-b.time};
  var nw=S.orders.filter(function(o){return o.status==="accepted"}).sort(byAge),pr=S.orders.filter(function(o){return o.status==="preparing"}).sort(byAge);
  var card=function(o,btn){var m=Math.floor((Date.now()-o.time)/60000);return '<div class="card'+(m>=15?' late':'')+'"><div class="row"><b>Table '+o.table+' · #'+o.id+'</b><span class="'+(m>=15?'err':'mute')+'" style="margin:0">'+m+' min ago'+(m>=15?' – late':'')+'</span></div><div style="font-size:17px;margin:4px 0 10px">'+fmt(o.items)+noteOf(o)+'</div>'+btn+'</div>'};
  var h='<div class="board"><div><h2>🆕 New orders</h2>'+(nw.length?nw.map(function(o){return card(o,'<button class="p" onclick="setS('+o.id+',\'preparing\')">👨‍🍳 Start preparing</button>')}).join(""):'<p class="mute">No new orders. Orders appear here automatically when customers order.</p>');
  h+='</div><div><h2>🔥 Preparing</h2>'+(pr.length?pr.map(function(o){return card(o,'<button class="ok" onclick="setS('+o.id+',\'ready\')">Mark ready</button>')}).join(""):'<p class="mute">Nothing is being prepared.</p>');
  return h+'</div></div>';
}
function route(){var h=location.hash.slice(1),m=/^table-(\d+)$/.exec(h);if(m){qrMode=true;view="customer";session.scan=+m[1]}else if(VIEWS.indexOf(h)>-1)view=qrMode?"customer":h}
window.addEventListener("hashchange",function(){route();render()});
route();
render();
</script>
</body>
